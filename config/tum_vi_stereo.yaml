%YAML:1.0
---
# TUM-VI stereo (hand-held, 512 x 512 export, cameras 0 and 1 + IMU). config/tum_vi.yaml with the second camera:
# camera1 and rig.imu_from_camera1 from the dataset's own calibration (its camchain.yaml), and the stereo match
# threshold.

camera:
  model: FISHEYE_EQUIDISTANT
  width: 512
  height: 512
  params: [190.97847715128717, 190.9733070521226, 254.93170605935475, 256.8974428996504, 0.0034823894022493434, 0.0007150348452162257, -0.0020532361418706202, 0.00020293673591811182]   # fx fy cx cy k1 k2 k3 k4 (cam0, equidistant)
  polar_exclusion_ratio: 0.0    # image-height fraction excluded at the top and at the bottom
  border_margin: 20             # margin at the image edges [px]
  mask_rectangles: []           # excluded regions [x0, x1, y0, y1] as image fractions

camera1:
  model: FISHEYE_EQUIDISTANT
  width: 512
  height: 512
  params: [190.44236969414825, 190.4344384721956, 252.59949716835982, 254.91723064636983, 0.0034003170790442797, 0.001766278153469831, -0.00266312569781606, 0.0003299517423931039]   # fx fy cx cy k1 k2 k3 k4 (cam1, equidistant)
  polar_exclusion_ratio: 0.0
  border_margin: 20             # margin at the image edges [px], as camera 0
  mask_rectangles: []

imu:
  gyro_noise: 0.00016           # white noise [rad/s/sqrt(Hz)] (dataset values, Allan values x2)
  accel_noise: 0.0028           # white noise [m/s^2/sqrt(Hz)]
  gyro_walk: 0.000022           # bias random walk [rad/s^2/sqrt(Hz)] (Allan values x10)
  accel_walk: 0.00086           # bias random walk [m/s^3/sqrt(Hz)]
  gravity_magnitude: 9.81       # [m/s^2]

rig:
  # camera to IMU: p_imu = R p_camera + t (inverse of T_cam_imu of cam0)
  imu_from_camera:
    - [-0.9995250378696754, 0.007501918507405214, -0.029890130316433127, 0.04557483564969807]
    - [0.02961534388586324, -0.034397360613931484, -0.9989693453701762, -0.07116180183799713]
    - [-0.008522328211654747, -0.9993800792498841, 0.034158851273856206, -0.04468125411714442]
    - [0, 0, 0, 1]
  # camera 1 to IMU (inverse of T_cam_imu of cam1); the pair is fixed, the online extrinsics move both cameras
  imu_from_camera1:
    - [-0.9995110484978582, 0.008104079263822521, -0.03019913624589138, -0.05545633914259545]
    - [0.030299116376600627, 0.012511643720192384, -0.9994625667418547, -0.06925002164224774]
    - [-0.007721883028733356, -0.9998888851620987, -0.012751072573940855, -0.047452864807513394]
    - [0, 0, 0, 1]
  clock_offset: 0.0             # t_imu = t_camera + clock_offset [s]; hardware-synchronized

feature_tracker:
  max_features: 200             # feature target after the initialization
  quality_level: 0.01           # corner quality relative to the best corner
  min_distance: 20.0            # minimum distance between features [px]
  grid_cols: 8                  # cells of about 64 px
  grid_rows: 8
  max_features_per_cell: 10     # longest tracks kept per cell
  min_features_per_cell: 3      # k > 0: the cap per cell shares the feature target over the occupied cells, between k and max_features_per_cell
  window_size: 21               # optical flow window [px] (also the camera 0 -> camera 1 match)
  max_pyramid_level: 3
  max_iterations: 30
  epsilon: 0.01
  max_forward_backward_error: 0.5   # track back to the previous image (and from camera 1 back to camera 0); drop points that miss by more [px] (0: off)
  gain_compensation: 1          # 1: scale the previous image by the brightness ratio of the two images before the optical flow; the auto exposure changes the gain by up to 50 % from one image to the next and breaks most tracks
  rotation_iterations: 1000     # robust rotation check: samples of three rays
  rotation_threshold_deg: 10.0  # robust rotation check: inlier angle [deg]; the check models a far scene (360 drone), hand-held the translation adds up to ~9 deg of parallax between images (1.5 m/s at 20 Hz, 0.5 m away), so only gross mismatches are rejected
  remove_light_clusters: 0      # off: the rule removes features on saturated night lights of the 360 flights
  cluster_std_ratio: 0.25
  cluster_min_intensity: 250    # > 0: only clusters whose features mostly see this intensity in their window (lights) are removed
  stereo_max_epipolar_error: 2.0    # a camera-1 match may leave the epipolar plane of its camera-0 ray by this much [px]: 2 pixel sigmas (estimator.pixel_sigma 1 px)

landmark_tracker:
  search_radius: 5.0            # search radius around the predicted pixel on the tangent plane [px at the image center scale]; fx 191 is close to the 204 px/rad of the 360 camera, so 5 px is the same 1.4 deg
  min_ncc: 0.8                  # minimum normalized cross-correlation of the stored tangent-plane patch
  patch_half_size: 12           # half size of the stored patch [px]
  loss_reasons: 43              # search a landmark after the tracker lost it by (bit mask): 1 not found, 2 masked, 4 rotation outlier, 8 grid cap, 16 light cluster, 32 image border; 43 adds the optical-flow losses, which here are mostly blur and exposure changes of a feature that stays visible (about 80 % of these searches pass the gate), not the unreliable losses of the 360 night flights

initializer:
  window_time: 2.0              # seconds of data used by the initializer
  excitation_accel_std: 0.0     # accel sample std separating still / excited [m/s^2]; 0: no start at rest, a hand-held device is never at rest (the start-at-rest method sets the velocity to zero at 0.01 m/s, right for a drone on the ground)
  max_still_disparity: 9.0      # mean pixel disparity separating still / moving [px]; the 2.8 deg of the 360 setting (10 px at 204 px/rad) at fx 191
  rotation_compensated_disparity: 1   # 1: the disparity is measured after turning the first ray by the gyro (only translation counts as moving); a hand-held start rotates in place, and the moving start then sees no translation
  max_features: 50              # tracker feature target while initializing
  refine_max_iterations: 50     # maximum-likelihood refinement iterations (0: no refinement)
  num_poses: 6                  # poses spread over the window
  min_rotation_deg: 10.0        # minimum summed gyro rotation over the window [deg]
  covariance_scale_orientation: 10  # scale of the recovered state's covariance
  covariance_scale_velocity: 1
  covariance_scale_gyro_bias: 10
  covariance_scale_accel_bias: 9
  min_covariance_rcond: 1.0e-12     # covariance recovery threshold
  gyro_bias_prior: [0.0, 0.0, 0.0]    # gyro bias linearization point
  accel_bias_prior: [0.0, 0.0, 0.0]   # accel bias linearization point
  pixel_sigma: 1.0              # pixel noise [px]
  rest_accel_bias_sigma: 0.03   # sigma of the accel bias along gravity measured from a start at rest to the initialization [m/s^2] (0: off)

estimator:
  max_clones: 20                # window size
  max_landmarks: 150            # full-window tracks kept as landmarks in the state (0: none)
  landmark_max_linearity: 1.0   # a long track becomes a landmark only when its linearity index 4 sigma_d / d is at most this (0: no limit); 1: the window separates the inverse depth from zero by 4 sigma (hundreds of far tracks are tested per second, a 2-sigma test still admits several per second). Outdoors the strongest corners are on clouds, which sit at infinity and drift with the wind: as landmarks they turn the orientation over their long life (the 1 s window update of such tracks is kept)
  landmark_relinearize_ratio: 0.3   # remove a landmark when |rho/rho_first - 1| * rho^2/mean(rho^2) exceeds this (0: never)
  landmark_max_gate_rejections: 2   # consecutive gate rejections that remove a landmark (others skip the measurement)
  landmark_dormant_time: 5.0    # a landmark whose track is lost stays in the state this long and is searched again at its predicted pixel [s] (0: off)
  pixel_sigma: 1.0              # pixel noise [px]
  time_offset_sigma: 0.02       # prior sigma of the camera time offset estimated online [s] (0: fixed)
  time_offset_walk: 0.0         # random walk of the time offset [s/sqrt(s)]; 0: camera and IMU share one clock (the 360 camera's clock drifts)
  extrinsic_rotation_sigma: 0.0087    # prior sigma of the camera-IMU rotation estimated online [rad] (0 with the next: fixed)
  extrinsic_translation_sigma: 0.01   # prior sigma of the camera-IMU translation estimated online [m]
  camera_param_sigma: 0.0       # the fisheye model has no online parameters
  triangulation:
    max_iterations: 5           # refinement: max accepted steps
    initial_damping: 1.0e-3
    max_damping: 1.0e10         # the refinement gives up at this damping
    min_step: 1.0e-6            # converged step norm
    min_relative_decrease: 1.0e-6   # converged relative cost decrease
    damping_factor: 10.0
    min_depth: 0.10             # min depth along the anchor ray [m]
    max_depth: 1000000.0        # max depth along the anchor ray [m]
    max_depth_baseline_ratio: 1000.0  # max distance / baseline ratio
    max_condition_number: 1000000.0   # max condition number of the linear triangulation
